# Pastelerías Miky — front + back + base de datos
#   docker compose up -d --build     →  http://localhost:8090  (sitio)  y  http://localhost:8090/admin/  (panel)
name: miky

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miky}
      POSTGRES_USER: ${POSTGRES_USER:-miky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: America/Mexico_City
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # esquema + catálogo (sólo la primera vez)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  back:
    build: ./back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-miky}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-miky}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}       # true cuando se sirva con HTTPS
      UPLOAD_DIR: /data/uploads
      TZ: America/Mexico_City
    volumes:
      - uploads:/data/uploads
      - ./db/migraciones:/app/migrations:ro   # cambios de esquema que se aplican sin borrar datos

  front:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"   # WEB_BIND=0.0.0.0 para abrirlo a la red
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/usr/share/nginx/uploads:ro

volumes:
  dbdata:
  uploads:
