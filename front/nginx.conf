server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 7m;   # imágenes subidas desde el sitio (el back limita a 6 MB)
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # No servir archivos internos del proyecto
  location = /nginx.conf { return 404; }
  location ~ /\. { return 404; }

  # API
  location /api/ {
    proxy_pass http://backMy:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Alertas en vivo del panel (Server-Sent Events): sin búfer ni corte por inactividad
  location = /api/staff/stream {
    proxy_pass http://backMy:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Imágenes subidas por admin/supervisor
  location /uploads/ {
    alias /usr/share/nginx/uploads/;
    expires 7d;
    add_header Cache-Control "public";
  }

  location /img/ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }

  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
